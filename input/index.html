<!DOCTYPE html>
<html lang="en">
<head>
    <title>Input Data Sebaran WiFi</title>
</head>
<body>
    <h2>Form Input Sebaran WiFi RT/RW</h2>

    <form action="input.php" onsubmit="return validateForm()" method="post">
        <label for="lat">Latitude:</label><br>
        <input type="text" id="lat" name="latitude"><br>

        <label for="long">Longitude:</label><br>
        <input type="text" id="long" name="longitude"><br>

        <label for="kelurahan">Kelurahan:</label><br>
        <input type="text" id="kelurahan" name="kelurahan"><br>

        <label for="rw">RW:</label><br>
        <input type="text" id="rw" name="rw"><br>

        <label for="rt">RT:</label><br>
        <input type="text" id="rt" name="rt"><br>

        <label for="pasang">Pasang:</label><br>
        <input type="text" id="pasang" name="pasang"><br>

        <label for="bangunan">Bangunan:</label><br>
        <input type="text" id="bangunan" name="bangunan"><br>

        <label for="alamat_lokasi">Alamat Lokasi:</label><br>
        <textarea id="alamat_lokasi" name="alamat_lokasi" rows="3"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>

    <p id="informasi" style="color: red;"></p>

    <script>
        function validateForm() {
            let lat = document.getElementById("lat").value;
            let long = document.getElementById("long").value;
            let text = "";

            if (isNaN(lat) || lat === "" || isNaN(long) || long === "") {
                text = "Koordinat Latitude dan Longitude harus berupa angka yang valid!";
                document.getElementById("informasi").innerHTML = text;
                event.preventDefault();
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
